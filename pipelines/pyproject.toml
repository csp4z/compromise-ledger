[project]
name = "ledger-pipelines"
version = "0.1.0"
description = "Lakehouse pipelines: bronze/silver/gold builds, exports, health checks, and the ledger CLI."
authors = [{ name = "Chris Peck" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "ledger-crawl",
    "ledger-schemas",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
ledger-schemas = { workspace = true }
ledger-crawl = { workspace = true }
