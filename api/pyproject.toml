[project]
name = "ledger-api"
version = "0.1.0"
description = "Read-only FastAPI service over the gold layer."
authors = [{ name = "Chris Peck" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "ledger-schemas",
    "pytz>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
ledger-api = "ledger_api.__main__:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
ledger-schemas = { workspace = true }
