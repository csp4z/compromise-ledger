# Versions are bumped by Renovate (minimumReleaseAge: 14 days).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        exclude: ^web/pnpm-lock\.yaml$  # generated; pnpm writes multiple YAML documents
      - id: check-json
      - id: detect-private-key
      # Export files must stay byte-exact: their SHA-256s are in datasets.json.
      - id: end-of-file-fixer
        exclude: ^LICENSE(-DATA)?$|^tests/sample-exports/
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^tests/sample-exports/
      - id: trailing-whitespace
        exclude: ^LICENSE(-DATA)?$|\.md$|^tests/sample-exports/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
