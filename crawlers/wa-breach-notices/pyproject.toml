[project]
name = "ledger-crawler-wa-breach-notices"
version = "0.1.0"
description = "Washington State Attorney General data-breach notifications crawler and parser."
authors = [{ name = "Chris Peck" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "ledger-crawl",
    "ledger-schemas",
]

[project.entry-points."ledger.crawlers"]
wa-breach-notices = "ledger_crawler_wa_breach_notices:WaBreachNoticeCrawler"

[project.entry-points."ledger.parsers"]
wa-breach-notices = "ledger_crawler_wa_breach_notices:WaBreachNoticeParser"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
ledger-crawl = { workspace = true }
ledger-schemas = { workspace = true }
