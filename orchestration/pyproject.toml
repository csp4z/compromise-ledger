[project]
name = "ledger-orchestration"
version = "0.1.0"
description = "Dagster definitions for the daily pipeline (ADR 0007)."
authors = [{ name = "Chris Peck" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.28",
    "dagster-webserver>=1.13.28",
    "ledger-crawl",
    "ledger-pipelines",
    "ledger-schemas",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
ledger-crawl = { workspace = true }
ledger-pipelines = { workspace = true }
ledger-schemas = { workspace = true }
