# The `lite` stack: Caddy (site + API proxy, HTTPS), the read-only API, and the daily job.
# Usage: `make up` / `make down` from the repo root. Settings come from deploy/compose/.env
# (copy .env.example); secrets live only there or in SOPS, never in Git.
name: compromise-ledger

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-build: &build
  context: ../..
  dockerfile: deploy/docker/Dockerfile

services:
  # One-shot: give Caddy's certificate volumes to the unprivileged caddy user.
  caddy-init:
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/data", "/config"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  caddy:
    <<: *hardening
    build:
      <<: *build
      target: caddy
    image: compromise-ledger-caddy:local
    user: "1000:1000"
    read_only: true
    depends_on:
      caddy-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${CL_HTTP_PORT:-80}:8080"
      - "${CL_HTTPS_PORT:-443}:8443"
      - "${CL_HTTPS_PORT:-443}:8443/udp"
    environment:
      CL_DOMAIN: ${CL_DOMAIN:-localhost}
      CL_ACME_EMAIL: ${CL_ACME_EMAIL:-contact5@kuricove.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: [/tmp]
    mem_limit: 128m

  api:
    <<: *hardening
    build:
      <<: *build
      target: api
    image: compromise-ledger-api:local
    read_only: true
    environment:
      CL_API_ROOT_PATH: /api
    volumes:
      - lake:/data:ro
    tmpfs: [/tmp]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  job:
    <<: *hardening
    build:
      <<: *build
      target: job
    image: compromise-ledger-job:local
    env_file:
      - path: .env
        required: false
    environment:
      TZ: UTC
      CL_PROFILE: lite
      CL_BACKUP_DIR: /backups
    volumes:
      - lake:/data
      - site:/srv/site
      # A host directory, so another machine can pull backups with rsync (see SELF_HOSTING.md).
      # It must exist and be writable by UID 10001.
      - ${CL_BACKUP_HOST_DIR:-./backups}:/backups
    tmpfs: [/tmp]
    # DuckDB is capped at 1 GB; the site build needs a few hundred MB on top.
    mem_limit: 1536m

volumes:
  lake:
  site:
  caddy_data:
  caddy_config:
